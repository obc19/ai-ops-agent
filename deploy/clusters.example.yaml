# 多集群接入示例：复制为 deploy/clusters.yaml 后把 CLUSTERS_CONFIG 指过去
# 未配置的集群会跳过；未配置的数据源同样跳过，不影响其他链路。
clusters:
  - name: prod-cluster
    namespace: prod
    prometheus_url: http://prometheus.prod:9090
    elasticsearch_url: http://elasticsearch.prod:9200
    elasticsearch_index: app-logs-*
    elasticsearch_username: ""
    elasticsearch_password: ""
    jaeger_url: ""                      # 可选，需同时开启 ENABLE_TRACE_AGENT
    kubernetes_api_url: ""              # 可选，需同时开启 ENABLE_K8S_ADAPTER
    kubernetes_token: ""

  - name: staging
    namespace: staging
    enabled: true
    prometheus_url: http://prometheus.staging:9090
    elasticsearch_url: http://elasticsearch.staging:9200
