# 单副本工作负载：采集调度与 SQLite 都在进程内，多副本会重复检测/重复告警
# Dashboard 与 /api 同源，Service 只需要暴露一个端口
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-ops-agent
  namespace: aiops
  labels:
    app.kubernetes.io/name: ai-ops-agent
spec:
  replicas: 1
  revisionHistoryLimit: 3
  # SQLite 挂在 ReadWriteOnce 卷上，滚动更新会出现两个 Pod 抢同一个卷 → 先停后起
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-ops-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-ops-agent
    spec:
      serviceAccountName: ai-ops-agent
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: ghcr.io/obc19/ai-ops-agent:0.7.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            - name: DATA_DIR
              value: /data
            - name: MOCK_MODE
              value: "false"
            - name: ENABLE_K8S_ADAPTER
              value: "true"
            - name: LOG_LEVEL
              value: INFO
            - name: DETECT_INTERVAL
              value: "10"
            - name: DEFAULT_CLUSTER
              value: prod-cluster
            - name: DEFAULT_NAMESPACE
              value: prod
            # 配置目录：ConfigMap 挂到这里，aiops.yaml / rules-*.yaml / clusters.yaml 都从这里读
            - name: CONFIG_DIR
              value: /etc/aiops
            # 服务器本体状态：读宿主机 /proc（下面用 hostPath 挂进来）
            # 去掉这个挂载则只监测容器自身，指标仍可用但看不到节点真实负载
            - name: SERVER_PROC_ROOT
              value: /host/proc
            # 容器 overlay 的磁盘占用意义有限；要看节点磁盘请接 node_exporter，
            # 或把宿主机目录只读挂进来自行指定 SERVER_DISK_PATHS
            - name: SERVER_DISK_PATHS
              value: /
            # 鉴权与外部凭据从 Secret 注入（保存解压后只在内存中）
            - name: OPERATOR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ai-ops-agent-secrets
                  key: operator-token
            - name: VIEWER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ai-ops-agent-secrets
                  key: viewer-token
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-ops-agent-secrets
                  key: llm-api-key
                  optional: true
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /etc/aiops
              readOnly: true
            # 宿主机 /proc：只读，用于采集节点负载、CPU、内存、fd、连接数、进程
            - name: host-proc
              mountPath: /host/proc
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ai-ops-agent-data
        - name: config
          configMap:
            name: ai-ops-agent-config
            # 没建这个 ConfigMap 时仍可启动：镜像内自带 /app/config 默认配置
            optional: true
        - name: host-proc
          hostPath:
            path: /proc
            type: Directory
      terminationGracePeriodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: ai-ops-agent
  namespace: aiops
  labels:
    app.kubernetes.io/name: ai-ops-agent
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ai-ops-agent
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
