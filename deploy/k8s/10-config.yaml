# 配置与数据卷
#
# 所有运行时配置都来自仓库根目录的 config/，在 K8s 里用一个 ConfigMap 整目录挂载：
#
#   kubectl -n aiops create configmap ai-ops-agent-config \
#     --from-file=config/aiops.yaml \
#     --from-file=config/rules-detection.yaml \
#     --from-file=config/rules-desensitize.yaml \
#     --from-file=config/clusters.yaml          # 可选，多集群时才有
#
#   # 改了配置后刷新（Pod 不会自动重载文件，需重启）
#   kubectl -n aiops create configmap ai-ops-agent-config --from-file=config/ ... --dry-run=client -o yaml \
#     | kubectl apply -f -
#   kubectl -n aiops rollout restart deploy/ai-ops-agent
#
# 为什么不在清单里内联配置：内联等于把仓库 config/ 复制一份，两边会漂移。
# 用 --from-file 生成，仓库里的 config/ 始终是唯一事实来源。
#
# 未创建该 ConfigMap 也能启动：镜像内自带一份默认配置（/app/config），
# 此时 CONFIG_DIR 指向的目录为空，程序自动回落到内置副本。
---
# SQLite / 向量库 / 审计日志都落在 /data
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ai-ops-agent-data
  namespace: aiops
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
  # storageClassName: standard
