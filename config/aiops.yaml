# =============================================================================
# ai-ops-agent 主配置文件
# -----------------------------------------------------------------------------
# 用法：
#   容器：docker run -v $(pwd)/config:/etc/aiops:ro ...
#   本地：把本文件放在仓库根 config/ 下（默认就在那），或设置 CONFIG_FILE=/path/aiops.yaml
#
# 优先级：构造函数参数 > 环境变量 > .env > 本文件 > 代码默认值
# 也就是说：这里写的是"常态配置"，临时改某一项仍然可以用环境变量覆盖，
# 例如 `-e LLM_API_KEY=sk-xxx` 会盖掉下面的 llm.api_key。
#
# 字段名规则：分区里的短名映射到 Settings 字段（llm.base_url → LLM_BASE_URL），
# 未做映射的分区（runtime / sources / clusters / modules / auth / alerting）
# 直接使用字段原名，等价于同名大写环境变量。
# =============================================================================

# ---- 运行模式 ----
runtime:
  mock_mode: true            # true = 内置 mock 数据源，不接任何外部系统即可跑通全链路
  host: 0.0.0.0
  port: 8080
  log_level: INFO            # DEBUG / INFO / WARNING / ERROR
  data_dir: ./data           # SQLite / 向量库 / 审计日志目录；容器内由 DATA_DIR=/data 覆盖

# ---- 外部数据源（未配置的适配器自动跳过）----
sources:
  prometheus_url: ""
  elasticsearch_url: ""
  elasticsearch_index: app-logs-*
  elasticsearch_username: ""
  elasticsearch_password: ""
  jaeger_url: ""
  kubernetes_api_url: ""     # 集群内留空 = 自动使用 ServiceAccount 直连 kubernetes.default.svc
  kubernetes_token: ""
  kubernetes_ca_file: ""
  kubernetes_token_file: ""
  kubernetes_namespaces: ""  # 只采这些命名空间的 Pod/Deployment，逗号分隔；留空 = 全部
  tls_verify: true           # 数据源用自签证书时置 false（仅限可信内网）

# ---- 服务器本体状态（本地直读 /proc，零外部依赖）----
# 这一层回答「机器本身怎么样」：负载、CPU、IO 等待、内存、磁盘、fd、连接数、僵尸进程。
# 它不依赖 Prometheus / cAdvisor，装上就有真实信号。
server:
  enabled: true
  # 看宿主机而不是容器自身：把宿主机 /proc 挂进来，例如
  #   docker run -v /proc:/host/proc:ro -e SERVER_PROC_ROOT=/host/proc ...
  proc_root: /proc
  # 磁盘使用率要看的路径，逗号分隔。容器内要统计宿主机磁盘需挂载宿主目录，
  # 例如 -v /:/host/root:ro 后这里写 /host/root
  disk_paths: "/"
  sample_interval_ms: 300      # 两次 CPU 采样间隔，用于算瞬时使用率

# ---- 主动拨测（平台自己去访问目标）----
# 要监控的 URL 列表在 probes.yaml（同目录），这里只控制开关与超时。
probe:
  enabled: true
  config: ""                   # 留空 = 自动使用同目录 probes.yaml
  timeout: 5

# ---- 服务依赖拓扑 ----
# 拓扑是「根因收敛」的唯一依据：多个服务同时异常时，靠它判断谁是源头、
# 谁是被带垮的，从而把 N 条告警压成 1 条。
#
# 数据来源按优先级合并：
#   1. 链路推导（首选）：配了 JAEGER_URL 就自动从 span 父子关系抽取，无需手工维护；
#   2. 手工声明（兜底）：trace 采样率低、或有异步调用（MQ / 定时任务）时补充。
# 两者都没有 → 空图 → 收敛自动退化为「不收敛」，绝不瞎猜。
topology:
  enabled: true
  refresh_seconds: 300         # 缓存多久重新推导一次；0 = 每次都用最新的
  escalate_by_impact: true     # 根因被 N 个下游连带时，等级提升到群内最严重
  # 手工声明调用关系，格式 {上游: [下游, ...]}
  # 例：order-service 调用 payment-service 与 user-service
  dependencies: {}
  # dependencies:
  #   api-gateway: [order-service]
  #   order-service: [payment-service, user-service]

# ---- 多集群 ----
clusters:
  # 集群清单路径在下面 rules.clusters 配置；留空时若本目录存在 clusters.yaml 会自动加载。
  default_cluster: prod-cluster
  default_namespace: prod

# ---- 可选模块 ----
modules:
  enable_trace_agent: false
  # K8s 采集开关。以下任一情况自动启用，通常不用管这里：
  #   1) 跑在集群里（读得到 ServiceAccount token）
  #   2) sources.kubernetes_api_url 配了地址
  # 只有「想强制打开」时才需要置 true
  enable_k8s_adapter: false

# ---- 大模型（不配 api_key = 规则模式，控制台会红条提示）----
llm:
  base_url: https://api.deepseek.com/v1
  model: deepseek-chat
  api_key: ""                # 建议用环境变量注入：-e LLM_API_KEY=sk-xxx
  timeout: 20

# ---- Embedding（留空则用内置哈希向量兜底，RAG 仍可用）----
embedding:
  base_url: ""
  model: ""
  api_key: ""
  dim: 8

# ---- 知识库 ----
knowledge:
  backend: simple            # simple / chroma / faiss
  dedup_threshold: 0.92
  top_k: 3
  min_score: 0.15            # RAG 检索最低相似度

# ---- 检测与告警节流 ----
detection:
  interval: 10               # 轮询周期（秒），决定故障发现延迟
  retention_days: 30
  alert_group_window: 300    # 同对象同指标聚合窗口（秒）
  alert_cooldown: 300        # 冷却期（秒）

# ---- 规则文件（相对本文件所在目录；也可写绝对路径）----
rules:
  detection: rules-detection.yaml
  desensitize: rules-desensitize.yaml
  clusters: ""               # 留空 = 自动用同目录 clusters.yaml（若存在）

# ---- Agent 超时预算（保证端到端 ≤60s）----
agent:
  timeout: 12                # 单 Agent 上限（秒）
  diagnosis_budget: 45       # 单次诊断总预算（秒）

# ---- 鉴权（三者都不配 = 本地体验模式，全部放行）----
auth:
  auth_token: ""             # admin：全部权限
  operator_token: ""         # operator：触发诊断、确认/关闭告警
  viewer_token: ""           # viewer：只读

# ---- 告警渠道 ----
alerting:
  alert_channels: feishu,dingtalk,email,webhook
  feishu_webhook: ""
  feishu_secret: ""          # 飞书机器人「加签」密钥
  dingtalk_webhook: ""
  dingtalk_secret: ""
  alert_webhook_url: ""
  smtp_host: ""
  smtp_port: 465
  smtp_user: ""
  smtp_password: ""
  smtp_use_tls: true
  alert_email_from: ""
  alert_email_to: ""
  mock_sink_base: ""         # mock 模式下内置接收端地址，留空跟随运行端口
