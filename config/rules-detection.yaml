# 异常检测规则：阈值 / 百分比 / 基线 / 日志
# 修改后无需改代码，重启生效

thresholds:
  - id: cpu-high
    name: CPU 使用率过高
    metric: cpu_usage_percent
    operator: ">="
    value: 85
    severity: P1
  - id: cpu-critical
    name: CPU 使用率严重超限
    metric: cpu_usage_percent
    operator: ">="
    value: 90
    severity: P0
  - id: mem-high
    name: 内存使用率过高
    metric: memory_usage_percent
    operator: ">="
    value: 85
    severity: P1
  - id: latency-high
    name: P99 延迟过高
    metric: http_latency_p99_ms
    operator: ">="
    value: 1000
    severity: P1
  - id: error-rate-high
    name: 错误率过高
    metric: http_error_rate_percent
    operator: ">="
    value: 5
    severity: P0

  # ---- 服务器本体（host_*）----
  # 单看 load 没意义，看「每个核的排队长度」：>1 已跑满，>2 明显排队
  - id: host-load-per-core-high
    name: 每核负载过高（CPU 排队）
    metric: host_load_per_core
    operator: ">="
    value: 2
    severity: P1
  - id: host-load-per-core-critical
    name: 每核负载严重超限
    metric: host_load_per_core
    operator: ">="
    value: 4
    severity: P0
  - id: host-cpu-high
    name: 服务器 CPU 使用率过高
    metric: host_cpu_usage_percent
    operator: ">="
    value: 85
    severity: P1
  - id: host-cpu-critical
    name: 服务器 CPU 使用率严重超限
    metric: host_cpu_usage_percent
    operator: ">="
    value: 95
    severity: P0
  - id: host-iowait-high
    name: IO 等待过高（磁盘成瓶颈）
    metric: host_cpu_iowait_percent
    operator: ">="
    value: 20
    severity: P1
  - id: host-mem-high
    name: 服务器内存使用率过高
    metric: host_memory_used_percent
    operator: ">="
    value: 90
    severity: P1
  - id: host-swap-in-use
    name: 已开始使用 Swap（内存不足）
    metric: host_swap_used_percent
    operator: ">="
    value: 30
    severity: P2
  - id: host-disk-high
    name: 磁盘空间不足
    metric: host_disk_used_percent
    operator: ">="
    value: 85
    severity: P1
  - id: host-disk-critical
    name: 磁盘空间严重不足
    metric: host_disk_used_percent
    operator: ">="
    value: 95
    severity: P0
  - id: host-fd-high
    name: 文件描述符接近耗尽
    metric: host_fd_used_percent
    operator: ">="
    value: 80
    severity: P1
  - id: host-fd-critical
    name: 文件描述符即将耗尽
    metric: host_fd_used_percent
    operator: ">="
    value: 90
    severity: P0
  - id: host-zombie
    name: 存在僵尸进程
    metric: host_zombie_processes
    operator: ">="
    value: 10
    severity: P2

  # ---- 主动拨测（probe_*）：用户视角的「慢」----
  - id: probe-total-slow
    name: 端到端访问变慢
    metric: probe_total_ms
    operator: ">="
    value: 1500
    severity: P1
  - id: probe-total-critical
    name: 端到端访问严重变慢
    metric: probe_total_ms
    operator: ">="
    value: 3000
    severity: P0
  - id: probe-ttfb-slow
    name: 服务端首字节慢
    metric: probe_ttfb_ms
    operator: ">="
    value: 800
    severity: P1
  - id: probe-dns-slow
    name: DNS 解析慢
    metric: probe_dns_ms
    operator: ">="
    value: 200
    severity: P2
  - id: probe-connect-slow
    name: 建立连接慢（网络链路）
    metric: probe_connect_ms
    operator: ">="
    value: 300
    severity: P2
  - id: probe-unavailable
    name: 拨测失败（服务不可用）
    metric: probe_ok
    operator: "=="
    value: 0
    severity: P0

  # ---- K8s 原生指标（k8s_*）：不需要 Prometheus，K8s API / metrics-server 直供 ----
  # 注意这些指标「有值才上报」：Pod 重启次数为 0、副本无缺口时根本不产出，
  # 所以阈值可以设得比较贴近真实影响面。
  - id: k8s-pod-restart-high
    name: Pod 反复重启（≥3 次）
    metric: k8s_pod_restarts
    operator: ">="
    value: 3
    severity: P1
  - id: k8s-pod-restart-critical
    name: Pod 反复重启（≥10 次，疑似循环崩溃）
    metric: k8s_pod_restarts
    operator: ">="
    value: 10
    severity: P0
  - id: k8s-pod-not-ready
    name: Pod 未就绪
    metric: k8s_pod_ready
    operator: "=="
    value: 0
    severity: P1
  - id: k8s-pod-cpu-high
    name: Pod CPU 接近 limit（限流风险）
    metric: k8s_pod_cpu_percent
    operator: ">="
    value: 90
    severity: P1
  - id: k8s-pod-memory-high
    name: Pod 内存接近 limit（OOM 风险）
    metric: k8s_pod_memory_percent
    operator: ">="
    value: 90
    severity: P1
  - id: k8s-deployment-unavailable
    name: 副本未就绪（服务能力下降）
    metric: k8s_deployment_ready_gap
    operator: ">="
    value: 1
    severity: P1
  - id: k8s-node-not-ready
    name: 节点不可用
    metric: k8s_node_ready
    operator: "=="
    value: 0
    severity: P0
  - id: k8s-node-memory-pressure
    name: 节点内存压力（开始驱逐 Pod）
    metric: k8s_node_memory_pressure
    operator: "=="
    value: 1
    severity: P1
  - id: k8s-node-disk-pressure
    name: 节点磁盘压力（开始驱逐 Pod）
    metric: k8s_node_disk_pressure
    operator: "=="
    value: 1
    severity: P1
  - id: k8s-node-cpu-high
    name: 节点 CPU 使用率过高
    metric: k8s_node_cpu_percent
    operator: ">="
    value: 85
    severity: P1
  - id: k8s-node-memory-high
    name: 节点内存使用率过高
    metric: k8s_node_memory_percent
    operator: ">="
    value: 90
    severity: P1

percent_change:
  - id: cpu-surge
    name: CPU 环比激增
    metric: cpu_usage_percent
    percent: 80
    severity: P2
  - id: host-load-surge
    name: 服务器负载环比激增
    metric: host_load1
    percent: 100
    severity: P2
  - id: host-conn-surge
    name: 服务器连接数环比激增
    metric: host_tcp_established
    percent: 200
    severity: P2

baseline:
  sigma: 3.0
  min_samples: 6
  # 只用前 60% 的样本建立基线，避免故障段污染
  train_ratio: 0.6
  severity: P2
  # 下面这些指标天然波动或单调增长，用 3σ 判异只会制造噪音，排除掉
  exclude_metrics:
    - host_disk_used_percent     # 磁盘只会慢慢涨，不是异常
    - host_cpu_cores             # 常量
    - host_process_count         # 随业务波动
    - host_tcp_established       # 随业务波动
    - host_zombie_processes      # 平时为 0，有值即由阈值规则覆盖
    - host_swap_used_percent     # 平时为 0
    - probe_ok                   # 0/1 离散值

log_rules:
  - id: log-cpu-throttle
    name: CPU 限流 / 队列积压
    pattern: "throttl|worker pool exhausted|queue length"
    severity: P1
  - id: log-oom
    name: 内存溢出
    pattern: "OutOfMemoryError|OOMKilled|heap space"
    severity: P1
  - id: log-timeout
    name: 上游超时
    pattern: "timeout|Timed out|deadline exceeded"
    severity: P1
  - id: log-conn
    name: 连接失败
    pattern: "connection refused|Connection reset"
    severity: P1
  - id: log-disk
    name: 磁盘空间不足
    pattern: "no space left on device"
    severity: P0
  - id: log-5xx
    name: 服务端 5xx
    pattern: "HTTP 5\\d\\d|Status 5\\d\\d"
    severity: P1

# ---- K8s 事件 / 对象状态（不依赖 Prometheus、不依赖 ELK）----
# 匹配 K8s 的 reason 常量（忽略大小写），也可用 pattern 兜住 reason 不规范的事件。
# 同对象同规则在窗口内累计达 min_count 次才报，默认 1 次即报。
# 这些是「事实型」信号：OOMKilled 发生了就是发生了，不需要看曲线。
k8s_events:
  - id: k8s-crashloop
    name: 容器反复崩溃（CrashLoopBackOff）
    reasons: [CrashLoopBackOff, BackOff, ContainerCannotRun, RunContainerError]
    severity: P0
    hint: 看容器退出码与最后几行日志：退出码 1 多为配置/依赖错误，137 多为 OOM 或被杀
  - id: k8s-oomkilled
    name: 容器被内核 OOM 杀死（OOMKilled）
    reasons: [OOMKilled]
    severity: P0
    hint: 内存 limit 给小了或存在泄漏；先看 container_memory 曲线再调 limit
  - id: k8s-image-pull
    name: 镜像拉取失败
    reasons: [ErrImagePull, ImagePullBackOff, InvalidImageName, ErrImageNeverPull]
    severity: P1
    hint: 镜像名/标签写错、私有仓库凭据（imagePullSecrets）缺失、仓库不可达
  - id: k8s-config-error
    name: 容器配置错误（缺 ConfigMap/Secret）
    reasons: [CreateContainerConfigError, CreateContainerError]
    severity: P1
    hint: 引用的 ConfigMap/Secret 不存在或键名不匹配
  - id: k8s-unschedulable
    name: Pod 无法调度
    reasons: [FailedScheduling, Unschedulable, FailedCreatePodSandBox]
    severity: P1
    hint: 资源 request 超过节点可分配量、亲和性/污点不满足、PVC 绑定不上
  - id: k8s-mount-failed
    name: 存储挂载失败
    reasons: [FailedMount, FailedAttachVolume]
    severity: P1
    hint: PVC/PV 绑定异常、StorageClass 不可用、云盘挂载数超限
  - id: k8s-evicted
    name: Pod 被节点驱逐
    reasons: [Evicted, Preempted]
    severity: P1
    hint: 节点资源压力（内存/磁盘）触发的驱逐，问题在节点不在业务
  - id: k8s-probe-unhealthy
    name: 健康检查持续失败
    reasons: [Unhealthy]
    severity: P2
    hint: 探针阈值过严或应用启动慢；持续失败会触发重启并演变成 CrashLoopBackOff
  - id: k8s-node-not-ready
    name: 节点失联/不可用
    reasons: [NodeNotReady, NodeNotSchedulable]
    severity: P0
    hint: kubelet 停止上报或节点宕机，其上 Pod 会被标记 NotReady 并逐步驱逐
  - id: k8s-quota
    name: 配额/磁盘资源耗尽
    pattern: "exceeded quota|no space left on device|DiskPressure"
    severity: P1
    hint: 命名空间 ResourceQuota 用尽或节点磁盘写满

# 同一对象同一指标只保留最高级别的异常（去重）
dedupe: true
