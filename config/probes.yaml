# =============================================================================
# 主动拨测目标
# -----------------------------------------------------------------------------
# 平台会按检测周期访问下面这些 URL，并把一次访问拆成五段计时：
#   probe_dns_ms      DNS 解析
#   probe_connect_ms  TCP 建连
#   probe_tls_ms      TLS 握手（http 为 0）
#   probe_ttfb_ms     发出请求到收到响应头（≈ 服务端处理时间）
#   probe_total_ms    端到端总耗时
# 这样「用户说慢」时能直接定位到是哪一段慢，而不是只有一句「P99 高了」。
#
# 这是唯一不依赖任何外部监控组件的信号源：只要平台能访问到 URL 就能测。
# 修改后重启生效；把 targets 留空则拨测自动跳过。
# =============================================================================

targets:
  # name：报告与告警里显示的对象名，建议用「业务-环境」形式
  # url：完整地址，支持 http / https
  # expect_status：期望状态码。填 200 时按 2xx 判定，填其它值则严格相等
  - name: self-console
    url: http://127.0.0.1:8080/healthz
    expect_status: 200

  # 下面这些是示例，按你的实际服务改；不用的直接删掉或注释
  # - name: web-prod
  #   url: https://www.example.com/
  #   expect_status: 200
  #
  # - name: api-prod
  #   url: https://api.example.com/v1/ping
  #   expect_status: 200
